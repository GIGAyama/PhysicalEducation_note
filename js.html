<script>
  let myRadarChart = null;
  let currentUser = null;
  let currentRefBase64 = null; // 画像キャッシュ用
  let detailRadarChartInst = null; // 教員用カルテのチャートインスタンス

  // ==== XSS対策: HTMLエスケープ ====
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // ==== 起動時の処理 ====
  document.addEventListener('DOMContentLoaded', () => {
    const btnInit = document.getElementById('btn-init');
    if (btnInit) {
      hideLoading();
      btnInit.addEventListener('click', handleInitialize);
    } else {
      initializeApp();
    }
  });

  // ==== アプリ初期化ロジック ====
  function initializeApp() {
    showLoading();
    runGoogleScript('getUserInfo')
      .then(user => {
        currentUser = user;
        document.getElementById('user-info-badge').textContent = `${user.number} ${user.name}`;
        document.getElementById('user-info-badge').classList.remove('d-none');

        if (user.role === 'teacher') {
          document.getElementById('teacher-view').classList.remove('d-none');
          loadTeacherData();
        } else {
          document.getElementById('student-view').classList.remove('d-none');
          loadStudentData();
          setupStudentForms();
        }
      })
      .catch(err => {
        hideLoading();
        showError('ユーザー情報の取得に失敗しました。');
      });
  }

  // ==== 初期化ボタン処理 (先生向け) ====
  function handleInitialize() {
    showLoading();
    runGoogleScript('initializeSetup')
      .then(res => {
        hideLoading();
        if (res.success) {
          Swal.fire({
            icon: 'success',
            title: '初期化完了！',
            text: 'スプレッドシートが作成されました。画面を更新します。',
            confirmButtonText: 'OK',
            confirmButtonColor: '#1a73e8'
          }).then(() => {
            window.top.location.href = res.appUrl;
          });
        } else {
          showError(res.error);
        }
      })
      .catch(err => {
        hideLoading();
        showError(err);
      });
  }

  let studentAllLogs = []; // フィルタリング用に元の配列を保持
  let studentAllActiveUnits = []; // 児童用に持たせる稼働単元リスト
  let currentSelectedUnitDetail = null; // 現在選んでいる単元の詳細情報

  // ==== 児童用画面ロジック ====
  function loadStudentData() {
    showLoading();
    runGoogleScript('getStudentData', currentUser.email)
      .then(data => {
        hideLoading();

        studentAllActiveUnits = data.activeUnits || [];
        initStudentUnitSelect();

        const classmates = data.classmates || [];
        const targetSelect = document.getElementById('thanks-target');
        targetSelect.innerHTML = '<option value="" selected disabled>選んでください</option>';
        classmates.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.email;
          opt.textContent = c.name;
          targetSelect.appendChild(opt);
        });

        drawRadarChart(data.radarData || [0, 0, 0, 0]);

        // 履歴を保持してフィルタUIを構築
        studentAllLogs = data.logs || [];
        buildHistoryFilter(studentAllLogs);
        filterHistory();

        renderReceivedThanks(data.receivedThanks);

        if (data.hasTodayGoal) {
          document.getElementById('goal-alert').classList.remove('d-none');
          document.getElementById('form-goal').classList.add('d-none');
        }
        if (data.hasTodayReflect) {
          document.getElementById('reflect-alert').classList.remove('d-none');
          document.getElementById('form-reflect').classList.add('d-none');
        }
      })
      .catch(err => {
        hideLoading();
        showError('データの取得に失敗しました。');
      });
  }

  // 単元選択ドロップダウンの初期化
  function initStudentUnitSelect() {
    const uSelect = document.getElementById('student-unit-select');
    uSelect.innerHTML = '<option value="" selected disabled>単元をえらぶ...</option>';

    studentAllActiveUnits.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.id;
      opt.textContent = u.name;
      uSelect.appendChild(opt);
    });

    // UIリセット
    const sSelect = document.getElementById('student-session-select');
    if (sSelect) {
      sSelect.innerHTML = '<option value="">-</option>';
      sSelect.disabled = true;
    }
    updateStudentDisplay(null, null);
  }

  // 単元が選ばれた時
  function onStudentUnitChanged() {
    const selectedId = document.getElementById('student-unit-select').value;
    const unit = studentAllActiveUnits.find(u => u.id === selectedId);
    if (!unit) return;

    currentSelectedUnitDetail = unit;

    const sSelect = document.getElementById('student-session-select');
    sSelect.innerHTML = '<option value="" selected disabled>時間...</option>';
    sSelect.disabled = false;

    for (let i = 1; i <= unit.totalSessions; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = i;
      sSelect.appendChild(opt);
    }

    // 何も選ばれていない状態の表示へ
    updateStudentDisplay(unit, null);
  }

  // 時間が選ばれた時
  function onStudentSessionChanged() {
    if (!currentSelectedUnitDetail) return;
    const sessionNum = parseInt(document.getElementById('student-session-select').value, 10);
    updateStudentDisplay(currentSelectedUnitDetail, sessionNum);
  }

  // 画面の表示（プログレスバー、目標、めあて、お手本）の更新
  function updateStudentDisplay(unit, sessionNum) {
    const badge = document.getElementById('current-unit-badge');
    const uGoal = document.getElementById('student-unit-goal');
    const sGoal = document.getElementById('student-session-goal');
    const sText = document.getElementById('student-session-text');
    const pBar = document.getElementById('student-progress-bar');
    const btnRef = document.getElementById('btn-view-ref');

    currentRefBase64 = null; // お手本リセット
    if (btnRef) btnRef.classList.add('d-none');

    if (!unit) {
      if (badge) {
        badge.textContent = '単元をえらんでね';
        badge.className = 'badge bg-secondary text-white fs-6 rounded-pill px-3 py-2';
      }
      if (uGoal) uGoal.textContent = '未設定';
      if (sGoal) sGoal.textContent = '単元と時間をえらんでね';
      if (sText) sText.textContent = '第-時 / 全-時間';
      if (pBar) pBar.style.width = '0%';
      return;
    }

    if (badge) {
      badge.textContent = `学習中：${unit.name}`;
      badge.className = 'badge bg-info text-dark fs-6 rounded-pill px-3 py-2 border shadow-sm';
    }
    if (uGoal) uGoal.textContent = unit.goal || '未設定';

    if (!sessionNum) {
      if (sGoal) sGoal.textContent = '時間をえらんでね';
      if (sText) sText.textContent = `第-時 / 全${unit.totalSessions}時間`;
      if (pBar) pBar.style.width = '0%';
      return;
    }

    if (sText) sText.textContent = `第${sessionNum}時 / 全${unit.totalSessions}時間`;
    const progress = Math.min(100, Math.max(0, (sessionNum / unit.totalSessions) * 100));
    if (pBar) pBar.style.width = `${progress}%`;

    // JSONからの該当時の設定を取得
    const sessionData = (unit.sessions || []).find(s => parseInt(s.session, 10) === sessionNum);
    if (sessionData) {
      if (sGoal) sGoal.textContent = sessionData.goal || '（未設定）';
      if (sessionData.mediaId && btnRef) {
        btnRef.classList.remove('d-none');
        btnRef.onclick = () => openReferenceModalFor(sessionData.mediaId);
      }
    } else {
      if (sGoal) sGoal.textContent = '（この時間の設定はありません）';
    }
  }

  function setupStudentForms() {
    const goalForm = document.getElementById('form-goal');
    goalForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!goalForm.checkValidity()) {
        goalForm.classList.add('was-validated');
        return;
      }
      const aspect = document.getElementById('goal-aspect').value;
      if (!aspect) return;
      submitLog('事前目標', 'goal-aspect', null, 'form-goal', 'goal-alert');
    });

    const reflectForm = document.getElementById('form-reflect');
    reflectForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!reflectForm.checkValidity()) {
        reflectForm.classList.add('was-validated');
        return;
      }
      const aspect = document.getElementById('reflect-aspect').value;
      const comment = document.getElementById('reflect-comment').value;
      if (!aspect || !comment) return;
      submitLog('事後振り返り', 'reflect-aspect', 'reflect-comment', 'form-reflect', 'reflect-alert');
    });

    const thanksForm = document.getElementById('form-thanks');
    thanksForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!thanksForm.checkValidity()) {
        thanksForm.classList.add('was-validated');
        return;
      }
      const targetEmail = document.getElementById('thanks-target').value;
      const comment = document.getElementById('thanks-comment').value;
      if (!targetEmail || !comment) return;

      submitLog('称賛', 'thanks-aspect', 'thanks-comment', 'form-thanks', 'thanks-alert');
    });
  }

  // 汎用記録送信ロジック
  function submitLog(type, aspectId, commentId, formId, alertId) {
    const form = document.getElementById(formId);
    if (!form.checkValidity()) {
      form.classList.add('was-validated');
      return;
    }

    const aspect = document.getElementById(aspectId).value;
    const comment = commentId ? document.getElementById(commentId).value : '';
    let targetEmail = '';

    if (type === '称賛') {
      const select = document.getElementById('thanks-target');
      if (select.value === "") {
        showError('送る相手を選んでください。');
        return;
      }
      targetEmail = select.value;
    }

    // 単元と時間の選択状態をチェック
    const selectedUnitId = document.getElementById('student-unit-select').value;
    const selectedSession = document.getElementById('student-session-select').value;

    if (!selectedUnitId || !selectedSession) {
      showError('「今日学習する単元」と「時間」を選んでから記録してください。');
      return;
    }

    const selectedUnitName = studentAllActiveUnits.find(u => u.id === selectedUnitId)?.name || '不明';

    showLoading();
    runGoogleScript('saveLog', currentUser.email, type, aspect, comment, targetEmail, selectedUnitName, selectedUnitId, selectedSession)
      .then(res => {
        hideLoading();
        Swal.fire({
          icon: 'success', title: '送信完了！', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000
        });

        if (type === '称賛') {
          form.reset();
          form.classList.remove('was-validated');
        } else {
          document.getElementById(alertId).classList.remove('d-none');
          form.classList.add('d-none');
        }

        if (type !== '称賛') loadStudentData();
      })
      .catch(err => {
        hideLoading();
        showError('送信に失敗しました。もう一度試してください。');
      });
  }

  // ==== Chart描画 ====
  function drawRadarChart(dataArray) {
    const ctx = document.getElementById('myRadarChart').getContext('2d');
    if (myRadarChart) myRadarChart.destroy();

    myRadarChart = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: ['知る', '見る', 'する', '支える'],
        datasets: [{
          label: 'えらんだ回数',
          data: dataArray,
          backgroundColor: 'rgba(26, 115, 232, 0.2)',
          borderColor: 'rgba(26, 115, 232, 1)',
          pointBackgroundColor: 'rgba(26, 115, 232, 1)',
          borderWidth: 2
        }]
      },
      options: {
        scales: { r: { beginAtZero: true, ticks: { stepSize: 1, display: false } } },
        plugins: { legend: { display: false } }
      }
    });
  }

  function renderHistory(logs) {
    const container = document.getElementById('history-list');
    container.innerHTML = '';
    if (!logs || logs.length === 0) {
      container.innerHTML = '<p class="text-muted small">まだ記録がありません。</p>';
      return;
    }
    logs.forEach(log => {
      const isReflect = log.type === '事後振り返り';
      const icon = isReflect ? '<i class="bi bi-chat-left-text text-warning"></i>' : '<i class="bi bi-flag text-primary"></i>';
      const div = document.createElement('div');
      div.className = 'border-bottom py-2 mb-2';
      div.innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-1">
          <small class="text-muted fw-bold">${escapeHtml(log.date)} ${icon} ${escapeHtml(log.type)}</small>
          ${getAspectBadge(log.aspect)}
        </div>
        ${isReflect ? `<div class="small bg-light p-2 rounded mt-1">${escapeHtml(log.comment)}</div>` : ''}
      `;
      container.appendChild(div);
    });
  }

  // ==== 履歴フィルタリング機能 ====
  function buildHistoryFilter(studentLogs) {
    const filterSelect = document.getElementById('history-filter');
    filterSelect.innerHTML = `<option value="all" selected>すべて表示</option>`;

    // ログから存在する単元名を抽出して重複排除
    let units = [...new Set(studentAllLogs.map(l => l.unit))].filter(Boolean);

    units.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u;
      opt.textContent = u;
      filterSelect.appendChild(opt);
    });
  }

  function filterHistory() {
    const filterVal = document.getElementById('history-filter').value;
    let filteredLogs = studentAllLogs;

    if (filterVal !== 'all') {
      filteredLogs = studentAllLogs.filter(l => l.unit === filterVal);
    }

    renderHistory(filteredLogs);
  }

  // ==== 児童マイ・ポートフォリオ ====
  let portfolioRadarChart = null;

  function openStudentPortfolio() {
    if (!studentAllLogs || studentAllLogs.length === 0) {
      showError('まだ記録がありません。ポートフォリオは記録されると見られるようになります。');
      return;
    }

    // 単元フィルタのプルダウンを構築
    const filterSelect = document.getElementById('portfolio-unit-filter');
    filterSelect.innerHTML = `<option value="all" selected>すべての単元</option>`;
    const units = [...new Set(studentAllLogs.map(l => l.unit))].filter(Boolean);
    units.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u;
      opt.textContent = u;
      filterSelect.appendChild(opt);
    });

    // 総合チャートを描画
    drawPortfolioRadarChart();

    // タイムラインを描画
    renderStudentPortfolioTimeline();

    // モーダルを開く
    new bootstrap.Modal(document.getElementById('studentPortfolioModal')).show();
  }

  function drawPortfolioRadarChart() {
    const ctx = document.getElementById('portfolioRadarChart').getContext('2d');
    if (portfolioRadarChart) portfolioRadarChart.destroy();

    // 過去すべての「えらんだ回数」を集計
    let counts = { '知る': 0, '見る': 0, 'する': 0, '支える': 0 };
    studentAllLogs.forEach(log => {
      if (counts[log.aspect] !== undefined) counts[log.aspect]++;
    });
    const dataArray = [counts['知る'], counts['見る'], counts['する'], counts['支える']];

    portfolioRadarChart = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: ['知る', '見る', 'する', '支える'],
        datasets: [{
          label: 'すべての記録',
          data: dataArray,
          backgroundColor: 'rgba(13, 202, 240, 0.2)', // Info color
          borderColor: 'rgba(13, 202, 240, 1)',
          pointBackgroundColor: 'rgba(13, 202, 240, 1)',
          borderWidth: 2
        }]
      },
      options: {
        scales: { r: { beginAtZero: true, ticks: { stepSize: 1, display: false } } },
        plugins: { legend: { display: false } }
      }
    });
  }

  function renderStudentPortfolioTimeline() {
    const filterVal = document.getElementById('portfolio-unit-filter').value;
    const container = document.getElementById('portfolio-timeline');

    let targetLogs = studentAllLogs;
    if (filterVal !== 'all') {
      targetLogs = studentAllLogs.filter(l => l.unit === filterVal);
    }

    // タイムライン要素の構築 (時系列順にするため、必要なら逆順等にするが、元の配列が新しい順ならそのまま）
    if (targetLogs.length === 0) {
      container.innerHTML = '<div class="text-center text-muted py-5">記録がありません。</div>';
      return;
    }

    let html = '<div class="border-start border-info border-3 ms-3 ps-3 position-relative">';
    targetLogs.forEach(log => {
      const isReflect = log.type === '事後振り返り';
      const icon = isReflect ? '<i class="bi bi-chat-left-text text-warning bg-light rounded-circle p-1 border"></i>'
        : '<i class="bi bi-flag text-primary bg-light rounded-circle p-1 border"></i>';
      const badge = getAspectBadge(log.aspect);

      html += `
        <div class="mb-4 position-relative">
          <div class="position-absolute start-0 translate-middle" style="left: -1rem !important;">${icon}</div>
          <div class="card shadow-sm border-0 border-start border-4 ${isReflect ? 'border-warning' : 'border-primary'}">
            <div class="card-body p-3">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <div>
                  <span class="badge bg-secondary mb-1">${escapeHtml(log.unit)} ${log.session ? '(第' + log.session + '時)' : ''}</span><br>
                  <small class="text-muted fw-bold">${escapeHtml(log.date)} - ${escapeHtml(log.type)}</small>
                </div>
                <div>${badge}</div>
              </div>
              ${isReflect ? `<p class="card-text bg-light p-2 rounded mb-0">${escapeHtml(log.comment)}</p>` : ''}
            </div>
          </div>
        </div>
      `;
    });
    html += '</div>';
    container.innerHTML = html;
  }

  function renderReceivedThanks(thanksData) {
    const container = document.getElementById('received-thanks-list');
    container.innerHTML = '';
    if (!thanksData || thanksData.length === 0) {
      container.innerHTML = '<p class="text-muted small">まだカードはありません。</p>';
      return;
    }
    thanksData.forEach(card => {
      const div = document.createElement('div');
      div.className = 'border-bottom py-2 mb-2';
      div.innerHTML = `
        <div class="d-flex align-items-center mb-1">
          <span class="badge bg-success me-2"><i class="bi bi-gift-fill"></i> From: ${escapeHtml(card.senderName)}</span>
          <small class="text-muted fw-bold">${escapeHtml(card.date)}</small>
        </div>
        <div class="small bg-white p-2 rounded mt-1 border border-success border-opacity-25">
          ${escapeHtml(card.comment)}
        </div>
      `;
      container.appendChild(div);
    });
  }

  // ==== お手本画像モーダル ====
  function openReferenceModalFor(mediaInput) {
    if (!mediaInput) return;

    const imgEl = document.getElementById('reference-image');
    const iframeContainer = document.getElementById('reference-iframe-container');
    const iframeEl = document.getElementById('reference-iframe');
    const loadingEl = document.getElementById('ref-loading');
    const modal = new bootstrap.Modal(document.getElementById('referenceModal'));

    // 初期化
    imgEl.classList.add('d-none');
    iframeContainer.classList.add('d-none');
    iframeEl.src = '';
    loadingEl.classList.remove('d-none');
    modal.show();

    // 1. Google スライドのURL判定
    // ex: https://docs.google.com/presentation/d/xxxxx/edit#slide=id.p
    // または "pub" リンク: https://docs.google.com/presentation/d/e/xxxxx/pub?start=false...
    const slideMatch = mediaInput.match(/docs\.google\.com\/presentation\/d\/(e\/)?([a-zA-Z0-9_-]+)/);
    if (slideMatch) {
      const isPub = slideMatch[1] === 'e/';
      const slideId = slideMatch[2];
      // pubリンクならそのままに近い形、editリンクならpreviewリンクへ変換
      const embedUrl = isPub
        ? 'https://docs.google.com/presentation/d/e/' + slideId + '/embed?start=false&loop=false&delayms=3000'
        : 'https://docs.google.com/presentation/d/' + slideId + '/preview';

      iframeEl.src = embedUrl;
      loadingEl.classList.add('d-none');
      iframeContainer.classList.remove('d-none');
      return;
    }

    // 2. YouTubeのURL判定
    const ytMatch = mediaInput.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
    if (ytMatch) {
      const embedUrl = 'https://www.youtube.com/embed/' + ytMatch[1];
      iframeEl.src = embedUrl;
      loadingEl.classList.add('d-none');
      iframeContainer.classList.remove('d-none');
      return;
    }

    // 3. Google Driveの画像URLからIDを抽出して表示（あるいはただのID文字列の場合）
    let driveId = mediaInput.trim();
    // URLの中からIDっぽい部分（ランダムな英数字-_が25文字以上続くもの）を抽出
    const driveMatch = driveId.match(/[-\w]{25,}/);
    if (driveMatch) {
      driveId = driveMatch[0];
    }

    // Driveの画像としてバックエンドにBase64化を依頼
    runGoogleScript('getReferenceImageBase64', driveId)
      .then(base64 => {
        loadingEl.classList.add('d-none');
        imgEl.src = base64;
        imgEl.classList.remove('d-none');
      })
      .catch(err => {
        loadingEl.classList.add('d-none');
        modal.hide();
        showError('画像を取得できませんでした。権限などをご確認ください。');
      });
  }

  // ==== 教員用画面ロジック ====
  function loadTeacherData() {
    showLoading();
    runGoogleScript('getTeacherData')
      .then(data => {
        hideLoading();

        // 進行中の単元一覧の描画
        const listContainer = document.getElementById('teacher-active-units-list');
        const emptyMsg = document.getElementById('teacher-no-units-msg');
        listContainer.innerHTML = '';

        if (!data.activeUnits || data.activeUnits.length === 0) {
          emptyMsg.classList.remove('d-none');
        } else {
          emptyMsg.classList.add('d-none');
          teacherAllActiveUnits = data.activeUnits; // 編集モーダルですぐ参照できるように保持
          data.activeUnits.forEach(unit => {
            const col = document.createElement('div');
            col.className = 'col-md-6 col-lg-4';
            col.innerHTML = `
              <div class="card h-100 border-primary border-opacity-25 shadow-sm">
                <div class="card-body">
                  <div class="d-flex justify-content-between align-items-start mb-2">
                    <h6 class="card-title fw-bold text-primary m-0">${escapeHtml(unit.name)}</h6>
                    <span class="badge bg-light text-dark border">全${unit.totalSessions}時間</span>
                  </div>
                  <p class="card-text small text-muted mb-3" style="min-height: 2.5em;">${escapeHtml(unit.goal)}</p>
                  <div class="d-flex justify-content-end gap-2">
                    <button class="btn btn-sm btn-outline-info rounded-pill" onclick="openUnitManagerModal('${unit.id}')">
                      <i class="bi bi-pencil"></i> 編集する
                    </button>
                    <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="archiveUnit('${unit.id}', '${escapeHtml(unit.name)}')">
                      <i class="bi bi-box-arrow-down"></i> 終了する
                    </button>
                  </div>
                </div>
              </div>
            `;
            listContainer.appendChild(col);
          });
        }

        renderTeacherTable(data.students);

        // ★ クラスポートフォリオ（全体分析）の描画
        if (data.classStats) {
          renderClassPortfolio(data.classStats);
        }
      })
      .catch(err => {
        hideLoading();
        showError('教員用データの読み込みに失敗しました。');
      });
  }

  // ==== 教員用 クラスポートフォリオ描画 ====
  let classRadarChartInst = null;
  let classTrendChartInst = null;

  function renderClassPortfolio(stats) {
    // 1. クラス全体の観点バランス（レーダーチャート）
    const rCtx = document.getElementById('classRadarChart').getContext('2d');
    if (classRadarChartInst) classRadarChartInst.destroy();

    // データは固定順：知る、見る、する、支える
    const radarDataArr = [
      stats.radarData['知る'] || 0,
      stats.radarData['見る'] || 0,
      stats.radarData['する'] || 0,
      stats.radarData['支える'] || 0
    ];

    classRadarChartInst = new Chart(rCtx, {
      type: 'radar',
      data: {
        labels: ['知る', '見る', 'する', '支える'],
        datasets: [{
          label: '選択された合計回数',
          data: radarDataArr,
          backgroundColor: 'rgba(13, 202, 240, 0.2)', // Info color
          borderColor: 'rgba(13, 202, 240, 1)',
          pointBackgroundColor: 'rgba(13, 202, 240, 1)',
          borderWidth: 2
        }]
      },
      options: {
        scales: { r: { beginAtZero: true, ticks: { stepSize: 1, display: false } } },
        plugins: { legend: { display: false } }
      }
    });

    // 2. 直近の提出数推移（棒グラフ）
    const tCtx = document.getElementById('classTrendChart').getContext('2d');
    if (classTrendChartInst) classTrendChartInst.destroy();

    // Stats オブジェクトのキー（MM/dd）をソートして配列化
    const dailyKeys = Object.keys(stats.dailyTrend).sort();
    const dailyData = dailyKeys.map(k => stats.dailyTrend[k]);

    classTrendChartInst = new Chart(tCtx, {
      type: 'bar',
      data: {
        labels: dailyKeys,
        datasets: [{
          label: '振り返り提出数',
          data: dailyData,
          backgroundColor: 'rgba(26, 115, 232, 0.7)', // Primary color
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: { beginAtZero: true, ticks: { stepSize: 1 } }
        },
        plugins: {
          legend: { display: false }
        }
      }
    });
  }
  showError('児童データの取得に失敗しました。');
      });
  }

  // ==== 単元マネージャー関連 ====
  let teacherAllActiveUnits = []; // 教員が管理中のアクティブ単元をJSONとして保持

  // 新規作成 or 編集 用にモーダルを開く
  function openUnitManagerModal(editUnitId = null) {
    const form = document.getElementById('form-create-unit');
    form.reset();
    form.classList.remove('was-validated');

    document.getElementById('edit-unit-id').value = editUnitId || "";

    const titleEl = document.getElementById('unit-modal-title');
    const alertEl = document.getElementById('unit-modal-alert');
    const btnSubmit = document.getElementById('btn-submit-unit');

    if (editUnitId) {
      // 編集モード
      const unit = teacherAllActiveUnits.find(u => u.id === editUnitId);
      if (unit) {
        titleEl.innerHTML = '<i class="bi bi-pencil-square"></i> 単元の設定を編集';
        alertEl.classList.add('d-none');
        btnSubmit.textContent = '変更を保存する';

        document.getElementById('new-unit-name').value = unit.name;
        document.getElementById('new-unit-sessions').value = unit.totalSessions;
        document.getElementById('new-unit-goal').value = unit.goal;

        generateSessionInputs(unit.sessions); // 既存データで入力欄生成
      }
    } else {
      // 新規作成モード
      titleEl.innerHTML = '<i class="bi bi-journal-plus"></i> <ruby>新<rt>あたら</rt></ruby>しい<ruby>単元<rt>たんげん</rt></ruby>の<ruby>作成<rt>さくせい</rt></ruby>';
      alertEl.classList.remove('d-none');
      btnSubmit.textContent = '単元を作成して開始する';
      document.getElementById('new-unit-sessions').value = 6;
      generateSessionInputs();
    }

    const modal = new bootstrap.Modal(document.getElementById('unitManagerModal'));
    modal.show();
  }

  // 時間数変更時に手動で再生成するイベント（編集時の警告含む）
  document.getElementById('new-unit-sessions').addEventListener('change', () => {
    generateSessionInputs();
  });

  function generateSessionInputs(existingSessions = null) {
    const total = parseInt(document.getElementById('new-unit-sessions').value, 10);
    const container = document.getElementById('dynamic-sessions-container');
    container.innerHTML = '';

    if (isNaN(total) || total < 1 || total > 30) {
      container.innerHTML = '<div class="text-danger small">1〜30の範囲で入力してください。</div>';
      return;
    }

    for (let i = 1; i <= total; i++) {
      let prefGoal = "";
      let prefMedia = "";
      if (existingSessions && existingSessions.length > 0) {
        const sData = existingSessions.find(s => parseInt(s.session, 10) === i);
        if (sData) {
          prefGoal = sData.goal || "";
          prefMedia = sData.mediaId || ""; // 過去の仕様ではDrive ID、今後はURLの場合もある
        }
      }

      const div = document.createElement('div');
      div.className = 'mb-3 pb-3 border-bottom';
      const mediaInputId = 'session-media-' + i;
      div.innerHTML = `
        <div class="fw-bold text-secondary mb-2">第${i}時</div>
        <div class="mb-2">
          <input type="text" class="form-control form-control-sm session-goal-input" data-session="${i}" placeholder="この時間のめあて" value="${escapeHtml(prefGoal)}" required>
          <div class="invalid-feedback">入力は必須です</div>
        </div>
        <div class="input-group input-group-sm">
          <span class="input-group-text"><i class="bi bi-image"></i></span>
          <input type="text" class="form-control session-media-input" id="${mediaInputId}" data-session="${i}" placeholder="URL貼り付け または Driveから選択" value="${escapeHtml(prefMedia)}">
          <button type="button" class="btn btn-outline-warning btn-sm" onclick="openDrivePicker('${mediaInputId}')" title="Driveから選ぶ">
            <i class="bi bi-folder2-open"></i>
          </button>
        </div>
      `;
      container.appendChild(div);
    }
  }

  // ==== Driveファイルピッカー ====
  let drivePickerTargetId = null;   // 選択後に値をセットする入力欄のID
  let driveFilesCache = null;       // 返り値をキャッシュする（モーダル開くたびにAPIを叁らないため）

  function openDrivePicker(inputId) {
    drivePickerTargetId = inputId;
    const modal = new bootstrap.Modal(document.getElementById('drivePickerModal'));
    modal.show();

    if (driveFilesCache && driveFilesCache.length > 0) {
      // キャッシュがあれまた好もなすぐ描画
      renderDriveFiles(driveFilesCache);
    } else {
      document.getElementById('drive-file-list').innerHTML =
        '<div class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm me-2"></div> 読み込み中...</div>';

      runGoogleScript('listMediaFiles')
        .then(function (res) {
          if (res.success) {
            driveFilesCache = res.files;
            // フォルダへのリンクを設定
            var folderLink = document.getElementById('drive-folder-link');
            folderLink.href = 'https://drive.google.com/drive/folders/' + res.folderId;
            renderDriveFiles(driveFilesCache);
          } else {
            document.getElementById('drive-file-list').innerHTML =
              '<div class="alert alert-danger small">フォルダの内容を取得できませんでした。</div>';
          }
        })
        .catch(function () {
          document.getElementById('drive-file-list').innerHTML =
            '<div class="alert alert-danger small">通信エラーが発生しました。</div>';
        });
    }

    // 検索ボックスの初期化
    var searchBox = document.getElementById('drive-search-box');
    searchBox.value = '';
    searchBox.oninput = function () {
      if (driveFilesCache) renderDriveFiles(driveFilesCache);
    };
  }

  function renderDriveFiles(files) {
    var query = (document.getElementById('drive-search-box').value || '').toLowerCase();
    var filtered = files.filter(function (f) { return f.name.toLowerCase().indexOf(query) !== -1; });
    var container = document.getElementById('drive-file-list');

    if (filtered.length === 0) {
      container.innerHTML = '<div class="text-muted text-center py-4">該当するファイルがありません。</div>';
      return;
    }

    var html = '<div class="list-group list-group-flush">';
    filtered.forEach(function (f) {
      var icon = f.type === 'slide' ? 'bi-file-earmark-slides text-warning'
        : f.type === 'image' ? 'bi-file-earmark-image text-info'
          : f.type === 'video' ? 'bi-file-earmark-play text-danger'
            : 'bi-file-earmark text-secondary';
      var typeLabel = f.type === 'slide' ? 'スライド'
        : f.type === 'image' ? '画像'
          : f.type === 'video' ? '動画' : 'その他';
      html += '<button type="button" class="list-group-item list-group-item-action py-2 px-3"' +
        ' onclick="selectDriveFile(\'' + escapeHtml(f.url) + '\', \'' + escapeHtml(f.name) + '\')">'
        + '<i class="bi ' + icon + ' me-2"></i>'
        + '<span class="me-2">' + escapeHtml(f.name) + '</span>'
        + '<span class="badge bg-secondary float-end">' + typeLabel + '</span>'
        + '</button>';
    });
    html += '</div>';
    container.innerHTML = html;
  }

  function selectDriveFile(url, name) {
    if (!drivePickerTargetId) return;
    var input = document.getElementById(drivePickerTargetId);
    if (input) input.value = url;
    // モーダルを閉じる
    bootstrap.Modal.getInstance(document.getElementById('drivePickerModal')).hide();
    drivePickerTargetId = null;
  }

  function submitUnit() {
    const form = document.getElementById('form-create-unit');
    if (!form.checkValidity()) {
      form.classList.add('was-validated');
      return;
    }

    const editUnitId = document.getElementById('edit-unit-id').value;
    const uName = document.getElementById('new-unit-name').value;
    const uSessions = parseInt(document.getElementById('new-unit-sessions').value, 10);
    const uGoal = document.getElementById('new-unit-goal').value;

    // 各時間詳細配列の組み立て（ここは単なる文字列URLをそのまま格納する）
    const sessionsArray = [];
    const goalInputs = document.querySelectorAll('.session-goal-input');
    const mediaInputs = document.querySelectorAll('.session-media-input');

    for (let i = 0; i < uSessions; i++) {
      sessionsArray.push({
        session: parseInt(goalInputs[i].dataset.session, 10),
        goal: goalInputs[i].value,
        mediaId: mediaInputs[i].value.trim()
      });
    }

    showLoading();
    bootstrap.Modal.getInstance(document.getElementById('unitManagerModal')).hide();

    if (editUnitId) {
      // 編集（更新）
      runGoogleScript('updateUnit', editUnitId, uName, uSessions, uGoal, sessionsArray)
        .then(res => {
          if (res.success) {
            Swal.fire({ icon: 'success', title: '単元を更新しました', confirmButtonColor: '#1a73e8' });
            loadTeacherData();
          } else {
            hideLoading(); showError(res.message);
          }
        })
        .catch(err => { hideLoading(); showError('更新に失敗しました。'); });
    } else {
      // 新規作成
      runGoogleScript('createUnit', uName, uSessions, uGoal, sessionsArray)
        .then(res => {
          if (res.success) {
            Swal.fire({ icon: 'success', title: '新しい単元パッケージを開始しました', confirmButtonColor: '#1a73e8' });
            loadTeacherData();
          }
        })
        .catch(err => { hideLoading(); showError('単元の作成に失敗しました。'); });
    }
  }

  function archiveUnit(unitId, unitName) {
    Swal.fire({
      title: '単元を終了しますか？',
      text: `「${unitName}」を終了し、過去の記録へ移動します。`,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33',
      cancelButtonColor: '#6c757d',
      confirmButtonText: '終了する',
      cancelButtonText: 'キャンセル'
    }).then((result) => {
      if (result.isConfirmed) {
        showLoading();
        runGoogleScript('archiveUnit', unitId)
          .then(res => {
            hideLoading();
            if (res.success) {
              Swal.fire('終了しました', '', 'success');
              loadTeacherData();
            } else {
              showError(res.message);
            }
          })
          .catch(err => {
            hideLoading();
            showError('単元のアーカイブに失敗しました。');
          });
      }
    });
  }

  function renderTeacherTable(students) {
    const tbody = document.getElementById('teacher-tbody');
    tbody.innerHTML = '';

    students.forEach(s => {
      const tr = document.createElement('tr');

      const isGoalMissing = s.todayGoalAspect === '未';
      const isReflectMissing = s.todayReflectAspect === '未';

      if (isGoalMissing || isReflectMissing) {
        tr.classList.add('alert-row');
      }

      const goalHtml = isGoalMissing ? `<span class="missing-text"><ruby>未入力<rt>みにゅうりょく</rt></ruby></span>` : getAspectBadge(s.todayGoalAspect);
      const reflectHtml = isReflectMissing ? `<span class="missing-text"><ruby>未入力<rt>みにゅうりょく</rt></ruby></span>` : getAspectBadge(s.todayReflectAspect);
      const biasAlertHtml = s.alertBias ? `<span class="badge bg-danger ms-1" title="${s.alertBias}ばかり選んでいます"><i class="bi bi-exclamation-triangle"></i> 偏り</span>` : '';

      tr.innerHTML = `
        <td>${escapeHtml(s.number)}</td>
        <td class="fw-bold">${escapeHtml(s.name)} ${biasAlertHtml}</td>
        <td>${goalHtml}</td>
        <td>${reflectHtml}</td>
        <td class="small text-muted text-truncate" style="max-width: 150px;">${escapeHtml(s.todayReflectComment) || '-'}</td>
        <td>
          <button class="btn btn-sm btn-outline-primary rounded-pill" onclick="openStudentDetail('${escapeHtml(s.email)}')">
            <i class="bi bi-search"></i> カルテ
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function getAspectBadge(aspect) {
    let className = 'bg-secondary';
    if (aspect === '知る') className = 'badge-shiru';
    if (aspect === '見る') className = 'badge-miru';
    if (aspect === 'する') className = 'badge-suru';
    if (aspect === '支える') className = 'badge-sasaeru';
    return `<span class="badge ${className} rounded-pill">${aspect}</span>`;
  }

  // ==== 教員用 個人カルテ ====
  function openStudentDetail(studentEmail) {
    showLoading();
    runGoogleScript('getStudentDetailForTeacher', studentEmail)
      .then(data => {
        hideLoading();
        document.getElementById('detail-student-name').textContent = data.name;

        const ctx = document.getElementById('detailRadarChart').getContext('2d');
        if (detailRadarChartInst) detailRadarChartInst.destroy();

        detailRadarChartInst = new Chart(ctx, {
          type: 'radar',
          data: {
            labels: ['知る', '見る', 'する', '支える'],
            datasets: [{
              label: 'えらんだ回数',
              data: data.radarData,
              backgroundColor: 'rgba(26, 115, 232, 0.2)',
              borderColor: 'rgba(26, 115, 232, 1)',
              pointBackgroundColor: 'rgba(26, 115, 232, 1)',
              borderWidth: 2
            }]
          },
          options: {
            scales: { r: { beginAtZero: true, ticks: { stepSize: 1, display: false } } },
            plugins: { legend: { display: false } }
          }
        });

        const historyContainer = document.getElementById('detail-history-list');
        historyContainer.innerHTML = '';
        if (data.logs.length === 0) {
          historyContainer.innerHTML = '<p class="text-muted small">記録がありません。</p>';
        } else {
          data.logs.forEach(log => {
            const isReflect = log.type === '事後振り返り';
            const icon = isReflect ? '<i class="bi bi-chat-left-text text-warning"></i>' : '<i class="bi bi-flag text-primary"></i>';
            const div = document.createElement('div');
            div.className = 'border-bottom py-2 mb-2';
            div.innerHTML = `
              <div class="d-flex justify-content-between align-items-center mb-1">
                <small class="text-muted fw-bold">${escapeHtml(log.date)} <span class="badge bg-light text-dark border">${escapeHtml(log.unit)}</span> ${icon} ${escapeHtml(log.type)}</small>
                ${getAspectBadge(log.aspect)}
              </div>
              ${isReflect ? `<div class="small bg-white p-2 rounded mt-1 border">${escapeHtml(log.comment)}</div>` : ''}
            `;
            historyContainer.appendChild(div);
          });
        }

        const thanksContainer = document.getElementById('detail-thanks-list');
        thanksContainer.innerHTML = '';
        if (data.receivedThanks.length === 0) {
          thanksContainer.innerHTML = '<p class="text-muted small">カードはまだありません。</p>';
        } else {
          data.receivedThanks.forEach(card => {
            const div = document.createElement('div');
            div.className = 'border-bottom py-2 mb-2';
            div.innerHTML = `
              <div class="d-flex align-items-center mb-1">
                <span class="badge bg-success me-2"><i class="bi bi-gift-fill"></i> From: ${escapeHtml(card.senderName)}</span>
                <small class="text-muted fw-bold">${escapeHtml(card.date)}</small>
              </div>
              <div class="small bg-white p-2 rounded mt-1 border border-success border-opacity-25">
                ${escapeHtml(card.comment)}
              </div>
            `;
            thanksContainer.appendChild(div);
          });
        }

        const modalEl = document.getElementById('studentDetailModal');
        // モーダル閉じた時にChartインスタンスを破棄してメモリリーク防止
        modalEl.addEventListener('hidden.bs.modal', function onHidden() {
          if (detailRadarChartInst) {
            detailRadarChartInst.destroy();
            detailRadarChartInst = null;
          }
          modalEl.removeEventListener('hidden.bs.modal', onHidden);
        }, { once: true });

        const modal = new bootstrap.Modal(modalEl);
        modal.show();
      })
      .catch(err => {
        hideLoading();
        showError('児童の詳細データの取得に失敗しました。');
      });
  }

  // ==== CSVダウンロード ====
  function downloadCsv() {
    Swal.fire({
      title: 'CSVを出力しますか？',
      text: "クラス全員のこれまでの記録をダウンロードします。",
      icon: 'info',
      showCancelButton: true,
      confirmButtonColor: '#1a73e8',
      cancelButtonColor: '#6c757d',
      confirmButtonText: 'ダウンロード',
      cancelButtonText: 'キャンセル'
    }).then((result) => {
      if (result.isConfirmed) {
        showLoading();
        runGoogleScript('getAllLogsForCsv')
          .then(dataArray => {
            hideLoading();
            let csvContent = "\uFEFF";

            dataArray.forEach(row => {
              let rowStr = row.map(item => {
                let str = String(item || '');
                str = str.replace(/"/g, '""');
                if (str.includes(',') || str.includes('\n') || str.includes('"')) {
                  str = `"${str}"`;
                }
                return str;
              }).join(',');
              csvContent += rowStr + "\r\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            const dateStr = new Date().toLocaleDateString('ja-JP').replace(/\//g, '');
            link.setAttribute("href", url);
            link.setAttribute("download", `スポ活ログ_${dateStr}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url); // メモリリーク防止
          })
          .catch(err => {
            hideLoading();
            showError('CSVの作成に失敗しました。');
          });
      }
    });
  }

  // ==========================================
  // 共通ユーティリティ (GIGA Standard v2)
  // ==========================================
  function runGoogleScript(funcName, ...args) {
    const MAX_RETRIES = 3;
    let attempt = 0;

    const execute = (resolve, reject) => {
      attempt++;
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((error) => {
          if (attempt < MAX_RETRIES) {
            console.warn(`[Retry ${attempt}/${MAX_RETRIES}] ${funcName} failed. Retrying in ${attempt * 1000}ms...`);
            setTimeout(() => execute(resolve, reject), attempt * 1000);
          } else {
            console.error(`[Error] ${funcName} failed after ${MAX_RETRIES} attempts.`, error);
            reject(error);
          }
        })
      [funcName](...args);
    };

    return new Promise(execute);
  }

  function showLoading() {
    document.getElementById('loading-overlay').classList.remove('d-none');
    document.getElementById('loading-overlay').style.display = 'flex';
    // ボタン連打防止: 全送信ボタンを無効化
    document.querySelectorAll('button[type="submit"], .btn-primary, .btn-warning, .btn-success, .btn-outline-primary').forEach(btn => {
      btn.disabled = true;
    });
  }

  function hideLoading() {
    document.getElementById('loading-overlay').classList.add('d-none');
    document.getElementById('loading-overlay').style.display = 'none';
    // ボタン復帰
    document.querySelectorAll('button[type="submit"], .btn-primary, .btn-warning, .btn-success, .btn-outline-primary').forEach(btn => {
      btn.disabled = false;
    });
  }

  function showError(message) {
    Swal.fire({
      icon: 'error',
      title: 'エラー',
      text: typeof message === 'string' ? message : '通信エラーが発生しました。',
      confirmButtonColor: '#dc3545'
    });
  }
