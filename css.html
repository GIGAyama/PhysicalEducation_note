<style>
  /* GIGA Standard v2: Modern Google Style */
  :root {
    --primary-color: #1a73e8;
    /* Google Blue */
    --bg-color: #f8f9fa;
    /* Off-white */
  }

  body {
    font-family: 'Zen Maru Gothic', sans-serif;
    background-color: var(--bg-color);
    color: #333;
    -webkit-font-smoothing: antialiased;
  }

  /* ルビの調整: 読みやすくスペースを確保 */
  ruby {
    ruby-position: over;
  }

  rt {
    font-size: 0.6em;
    color: #666;
  }

  /* 全画面ローディングオーバーレイ */
  #loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(255, 255, 255, 0.85);
    z-index: 9999;
    display: flex;
    /* 初期表示はflexで中央揃え */
  }

  /* ボタンやカードの角丸強化 */
  .rounded-3 {
    border-radius: 0.75rem !important;
  }

  .rounded-pill {
    border-radius: 50rem !important;
  }

  /* 入力タブのデザイン */
  .nav-pills .nav-link {
    color: var(--primary-color);
    background-color: transparent;
  }

  .nav-pills .nav-link.active {
    background-color: var(--primary-color);
    color: white;
  }

  /* 教員用テーブルのアラートスタイル */
  .alert-row {
    background-color: #fff3cd !important;
    /* 薄い黄色 */
  }

  .missing-text {
    color: #dc3545;
    /* 赤 */
    font-weight: bold;
  }

  /* 観点バッジの色 */
  .badge-shiru {
    background-color: #ffc107;
    color: #000;
  }

  /* 黄 */
  .badge-miru {
    background-color: #17a2b8;
    color: #fff;
  }

  /* 水色 */
  .badge-suru {
    background-color: #dc3545;
    color: #fff;
  }

  /* 赤 */
  .badge-sasaeru {
    background-color: #28a745;
    color: #fff;
  }

  /* 緑 */

  /* タップターゲット最小サイズ(児童のタッチ操作対応) */
  .btn,
  .nav-link,
  .form-select,
  .form-control {
    min-height: 44px;
  }

  /* ボタン無効化時の視覚フィードバック */
  button:disabled,
  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* スクロールコンテナのスクロールバーデザイン */
  .overflow-auto::-webkit-scrollbar {
    width: 6px;
  }

  .overflow-auto::-webkit-scrollbar-track {
    background: transparent;
  }

  .overflow-auto::-webkit-scrollbar-thumb {
    background-color: rgba(0, 0, 0, 0.15);
    border-radius: 3px;
  }

  .overflow-auto::-webkit-scrollbar-thumb:hover {
    background-color: rgba(0, 0, 0, 0.3);
  }

  /* モバイル調整 */
  @media (max-width: 767.98px) {
    .card-body {
      padding: 1rem !important;
    }

    .table {
      font-size: 0.85rem;
    }

    .table td,
    .table th {
      white-space: nowrap;
    }

    header h1 {
      font-size: 1.1rem !important;
    }
  }

  /* 走るシルエットアニメーション */
  .running-container {
    text-align: center;
  }

  .running-man {
    font-size: 3.5rem;
    color: var(--primary-color);
    display: inline-block;
    animation: runningBounce 0.4s infinite alternate ease-in-out;
  }

  @keyframes runningBounce {
    0% {
      transform: translateY(0) rotate(5deg) scaleX(1.1);
    }

    100% {
      transform: translateY(-15px) rotate(-5deg) scaleX(0.9);
    }
  }

  .loading-track {
    width: 80px;
    height: 4px;
    background: rgba(26, 115, 232, 0.2);
    border-radius: 2px;
    margin: 10px auto;
    position: relative;
    overflow: hidden;
  }

  .loading-track::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 30px;
    background: var(--primary-color);
    border-radius: 2px;
    animation: trackMove 1s infinite linear;
  }

  @keyframes trackMove {
    0% {
      left: -30px;
    }

    100% {
      left: 80px;
    }
  }

  .loading-text-animated {
    font-size: 0.9rem;
    font-weight: bold;
    color: var(--primary-color);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {

    0%,
    100% {
      opacity: 0.5;
    }

    50% {
      opacity: 1;
    }
  }
</style>
