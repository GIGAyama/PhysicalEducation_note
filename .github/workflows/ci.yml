# =====================================================================
# ci.yml — このリポジトリの最低限の点検
# =====================================================================
# このリポジトリは GAS の .gs と、GAS テンプレートの .html だけでできて
# いて、ビルドもテストも持たない。それでも次の2つは機械で見ておきたい:
#
#   1. syntax — .gs が構文として壊れていないか。GAS は貼り付けて保存する
#      まで誤りに気づけないので、その前に落とす。
#   2. drift  — 正本（GIGAyama.github.io/standards/）からコピーした
#      ファイルが、正本の更新に取り残されていないか。
#
# .html は GAS のテンプレート（<?= ?> を含みうる）なので構文検査の対象外。
# =====================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: .gs / .mjs の構文検査
        run: |
          set -e
          fail=0
          # node は .gs 拡張子を知らないので、.js として写してから見る
          for f in *.gs; do
            [ -e "$f" ] || continue
            cp "$f" "/tmp/$(basename "$f").js"
            node --check "/tmp/$(basename "$f").js" || fail=1
          done
          for f in scripts/*.mjs; do
            [ -e "$f" ] || continue
            node --check "$f" || fail=1
          done
          exit $fail

  # 生成物が原本と食い違っていないか。
  # ライブラリを自己ホストにしたので、原本（vendor.config.json / src/app.jsx など）を
  # 直したのに npm run build を忘れると、リポジトリの中身だけが古いまま残る。
  # 構文検査もスキル照合も通ってしまい、貼り付けて動かすまで気づけない。
  #
  # ⚠️ 検査はコミットされている中身と比べる。前に build を走らせても結果は変わらない
  #    （作業ツリーと比べていたころは、build を先に置くだけで必ず緑になった）。
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 生成物が原本と一致しているか
        run: npm run ci

  # 正本（GIGAyama.github.io/standards/）からコピーしたファイルが、
  # 正本の更新に取り残されていないかを見る。standards-map.json が対応表。
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GIGAyama/GIGAyama.github.io
          path: .standards-src
      - name: 正本とのずれ検知
        run: node .standards-src/standards/check-drift.mjs --standards .standards-src/standards
